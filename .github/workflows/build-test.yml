# Manual multi-arch build of any branch, published as ghcr.io/m4rc02u1f4a4/ytrss:dev
# to try a change before it lands on main. Releases come from release.yml.
name: Build test image

on:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_TAG: dev

# NOTE: storage cleanup is intentionally NOT automated here.
# `actions/delete-package-versions` with `delete-only-untagged-versions: true`
# mistakes per-platform manifests (referenced only via the multi-arch manifest
# list) for orphans and deletes them, corrupting `docker pull` for the affected
# platform. Reclaim storage by hand, after checking the digests are truly
# untagged AND not referenced by any manifest list.
jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute lowercase image name
        # GHCR rejects repository names with uppercase characters.
        run: echo "IMAGE_NAME=ghcr.io/${OWNER,,}/ytrss" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Attestations would show up as extra `unknown/unknown` entries in the
          # manifest list. Test builds are not signed.
          provenance: false
          sbom: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${OWNER,,}/ytrss" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        # GHCR sometimes 404s a manifest it accepted seconds earlier: the
        # per-platform digests are in the registry but briefly not readable
        # through /v2/.../manifests, and `imagetools create` fails on an
        # otherwise perfect build. Retry instead of re-running the workflow.
        run: |
          shopt -s nullglob
          digests=(*)
          if [ ${#digests[@]} -eq 0 ]; then
            echo "::error::no digest files were downloaded — the build jobs did not upload any"
            exit 1
          fi
          echo "Assembling ${#digests[@]} platform digest(s)."
          refs=$(printf '${{ env.IMAGE_NAME }}@sha256:%s ' "${digests[@]}")
          for attempt in 1 2 3 4 5; do
            # shellcheck disable=SC2086 # refs is a space-separated list
            if docker buildx imagetools create \
                 -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} $refs; then
              echo "Published ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              wait=$((attempt * 10))
              echo "::warning::imagetools create failed (attempt $attempt/5) — GHCR may not have propagated a digest yet; retrying in ${wait}s"
              sleep "$wait"
            fi
          done
          echo "::error::could not publish the manifest list after 5 attempts"
          exit 1
