name: New release

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7

    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Every release gets its own tag, plus "beta" for pre-releases named *beta* and "latest" otherwise.
    - uses: docker/build-push-action@v7
      with:
        context: app
        push: true
        tags: |
          ghcr.io/m4rc02u1f4a4/ytrss:${{ github.event.release.tag_name }}
          ghcr.io/m4rc02u1f4a4/ytrss:${{ contains(github.event.release.tag_name, 'beta') && 'beta' || 'latest' }}
